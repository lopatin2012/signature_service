[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signature-service"
version = "1.2.0"
description = "FastAPI microservice for CAdES-BES electronic signatures (Windows/CryptoPro or Linux/pycades)"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn>=0.38.0",
    "python-dotenv>=1.1.0",
    "pywin32>=305; sys_platform=='win32'",
    "pycadence>=2.0.0; sys_platform!='win32'",
    "tenacity>=9.0.0",
]

[tool.setuptools.packages.find]
include = ["signers*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.28.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pylint>=3.3.0",
]

[project.scripts]
signature-service = "main:run_selftest"
