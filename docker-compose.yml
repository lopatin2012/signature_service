# Запуск: docker compose up -d --build
# Перед запуском положите PFX-сертификат в ./certs/cert.pfx
# и задайте в .env: CERT_PASSWORD=secret (пароль PFX),
# а при наличии — CSP_LICENSE=ключ_лицензии_КриптоПро.
services:
  signature-service:
    build: .
    image: signature-service:latest
    container_name: signature-service
    ports:
      - "8101:8101"
    environment:
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8101
      # Внутри контейнера всегда LinuxSigner (pycades/КриптоПро CSP):
      # сертификат импортируется в хранилище КриптоПро при старте.
      CERT_PATH: /certs/cert.pfx
      CERT_PASSWORD: ${CERT_PASSWORD:-}
      # Опционально: ключ лицензии КриптоПро CSP.
      CSP_LICENSE: ${CSP_LICENSE:-}
    volumes:
      # Монтируем сертификат только на чтение.
      - ./certs/cert.pfx:/certs/cert.pfx:ro
    restart: unless-stopped